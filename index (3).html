<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SPIDEY TRACKER // MISSION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070b;
    --panel:#0e0e15;
    --panel-2:#131320;
    --web:#7b8494;
    --web-dim:#2a2f3d;
    --red:#e0263d;
    --magenta:#ff2e63;
    --yellow:#ffd23f;
    --green:#3ddc97;
    --ink:#e9ecf1;
    --ink-dim:#8b91a3;
    --map-bg:#0b0f14;
    --map-line:#1c2432;
    --display:'Bebas Neue', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--mono); overflow:hidden; }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }

  #web-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.3; }
  #web-bg svg{width:100%; height:100%;}
  .web-line{ stroke:var(--web-dim); stroke-width:1; fill:none; }

  .scan-line{
    position:fixed; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, rgba(224,38,61,0.55), transparent);
    z-index:2; pointer-events:none; animation:scan 5.5s linear infinite;
  }
  @keyframes scan{ 0%{top:-2px;} 100%{top:100%;} }
  .noise{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .vignette{ position:fixed; inset:0; z-index:4; pointer-events:none; box-shadow: inset 0 0 18vw rgba(0,0,0,0.85); }

  /* status bar: game HUD */
  #statusbar{
    position:fixed; top:0; left:0; right:0; z-index:7; display:none;
    align-items:center; justify-content:space-between;
    padding:12px 18px; font-family:var(--mono); font-size:10px; letter-spacing:0.1em;
    color:var(--ink-dim); text-transform:uppercase;
    background:linear-gradient(180deg, rgba(7,7,11,0.92), transparent);
  }
  #statusbar .sb-left{ display:flex; align-items:center; gap:8px; color:var(--ink); }
  #statusbar .sb-right{ display:flex; align-items:center; gap:12px; }
  .xp-tag{ display:flex; align-items:center; gap:5px; color:var(--yellow); }
  .xp-tag .xp-val{ font-family:var(--display); font-size:14px; letter-spacing:0.03em; transition:transform 0.2s ease; }
  .level-tag{ color:var(--web); }

  /* floating XP popup */
  .xp-popup{
    position:fixed; z-index:20; left:50%; top:44%;
    transform:translate(-50%,0);
    font-family:var(--display); font-size:22px; color:var(--yellow);
    text-shadow:0 0 16px rgba(255,210,63,0.7);
    opacity:0; pointer-events:none;
    animation:xp-float 1.1s ease-out forwards;
  }
  @keyframes xp-float{
    0%{ opacity:0; transform:translate(-50%,10px) scale(0.7); }
    20%{ opacity:1; transform:translate(-50%,-10px) scale(1.15); }
    70%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-60px) scale(1); }
  }

  /* achievement toast */
  .toast{
    position:fixed; top:44px; left:50%; z-index:19;
    transform:translate(-50%,-140%);
    background:linear-gradient(135deg, var(--panel-2), var(--panel));
    border:1px solid var(--yellow);
    box-shadow:0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,210,63,0.15);
    border-radius:8px; padding:10px 18px;
    font-size:11px; letter-spacing:0.06em; color:var(--ink);
    display:flex; align-items:center; gap:8px;
    transition:transform 0.5s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
  }
  .toast.show{ transform:translate(-50%,0); }
  .toast .t-icon{ font-size:15px; }

  /* ===== SCREENS ===== */
  .screen{
    position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity 0.6s ease;
  }
  .screen.active{ opacity:1; visibility:visible; pointer-events:auto; }

  /* GATE */
  #gate{ flex-direction:column; gap:24px; }
  .gate-eyebrow{
    font-family:var(--mono); letter-spacing:0.4em; font-size:11px; color:var(--red); text-transform:uppercase;
    display:flex; align-items:center; gap:10px;
  }
  .gate-eyebrow::before, .gate-eyebrow::after{ content:''; width:24px; height:1px; background:var(--red); opacity:0.6; }
  .gate-title{ font-family:var(--display); font-size:clamp(34px,7vw,58px); letter-spacing:0.06em; color:var(--ink); text-shadow:0 0 24px rgba(224,38,61,0.35); margin:0; }
  .gate-sub{ font-size:12px; color:var(--ink-dim); letter-spacing:0.05em; text-align:center; max-width:320px; line-height:1.6; }
  .keypad-display{ width:220px; height:54px; background:var(--panel); border:1px solid var(--web-dim); border-radius:4px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .digit-slot{ width:14px; height:14px; border-radius:50%; border:1px solid var(--web); transition:all 0.15s ease; }
  .digit-slot.filled{ background:var(--red); border-color:var(--red); box-shadow:0 0 10px rgba(224,38,61,0.7); }
  .keypad{ display:grid; grid-template-columns:repeat(3, 62px); gap:12px; }
  .key{ width:62px; height:62px; background:var(--panel); border:1px solid var(--web-dim); border-radius:6px; color:var(--ink); font-family:var(--mono); font-size:18px; font-weight:500; cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; justify-content:center; }
  .key:hover{ border-color:var(--red); color:var(--red); }
  .key:active{ transform:scale(0.94); background:rgba(224,38,61,0.12); }
  .key.wide{ font-size:11px; letter-spacing:0.05em; color:var(--ink-dim); }
  .gate-error{ font-size:11px; letter-spacing:0.08em; color:var(--red); height:14px; opacity:0; transition:opacity 0.2s ease; text-transform:uppercase; }
  .gate-error.show{ opacity:1; animation:shake 0.35s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* DECK */
  .case-screen{ flex-direction:column; padding:64px 20px 74px; text-align:center; }
  .frame{
    position:relative; width:min(560px, 92vw); padding:28px 26px 26px;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--web-dim); border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,0.6);
  }
  .corner-tl, .corner-br{ position:absolute; width:22px; height:22px; border:1px solid var(--red); opacity:0.7; }
  .corner-tl{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .corner-br{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  .frame-topline{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .badge-row{ display:flex; align-items:center; gap:8px; }
  .spider-emoji{ font-size:20px; filter:drop-shadow(0 0 10px rgba(224,38,61,0.6)); animation:swing 2.6s ease-in-out infinite; transform-origin:top center; }
  @keyframes swing{ 0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(8deg);} }
  .level-badge{ font-family:var(--mono); font-size:9px; letter-spacing:0.15em; color:var(--ink-dim); border:1px solid var(--web-dim); border-radius:20px; padding:3px 10px; text-transform:uppercase; }

  .kicker{ font-family:var(--mono); font-size:10px; letter-spacing:0.35em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:10px; }
  .kicker.alert{ color:var(--red); } .kicker.warn{ color:var(--yellow); } .kicker.ok{ color:var(--green); }
  .headline{ font-family:var(--display); font-size:clamp(23px, 5.4vw, 34px); letter-spacing:0.03em; line-height:1.15; margin:0 0 10px; color:var(--ink); }
  .headline .hl{ color:var(--red); } .headline .hl-g{ color:var(--green); }
  .location-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--web);
    border:1px solid var(--web-dim); border-radius:20px; padding:3px 12px; margin-bottom:14px;
    text-decoration:none; cursor:pointer; transition:border-color .15s ease, color .15s ease, transform .12s ease;
  }
  .location-tag:hover{ border-color:var(--red); color:var(--ink); }
  .location-tag:active{ transform:scale(.96); }

  .type-line{ font-family:var(--mono); font-size:14px; color:var(--ink-dim); line-height:1.7; min-height:24px; }
  .type-line .cursor{ display:inline-block; width:8px; height:16px; background:var(--red); margin-left:2px; vertical-align:middle; animation:blink 0.9s step-end infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  /* scan lock overlay */
  .scan-zone{ position:relative; cursor:pointer; }
  .scan-lock{
    margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:10px; letter-spacing:0.15em; color:var(--web); text-transform:uppercase;
    opacity:1; transition:opacity 0.25s ease;
  }
  .scan-zone.revealed .scan-lock{ display:none; }
  .scan-lock .lock-icon{ animation:lock-pulse 1.4s ease-in-out infinite; }
  @keyframes lock-pulse{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }

  /* pins */
  .pin-stage{ position:relative; height:150px; margin:6px auto 4px; display:flex; align-items:flex-end; justify-content:center; gap:26px; }
  .pin{ position:relative; width:74px; display:flex; flex-direction:column; align-items:center; animation:pin-drop 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  .pin.p2{ animation-delay:0.25s; }
  @keyframes pin-drop{ 0%{ transform:translateY(-80px) scale(0.6); opacity:0; } 70%{ transform:translateY(4px) scale(1.05); opacity:1; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
  .pin-avatar{ width:64px; height:64px; border-radius:50%; border:3px solid var(--red); object-fit:cover; box-shadow:0 0 0 4px rgba(224,38,61,0.15), 0 10px 20px rgba(0,0,0,0.5); background:var(--panel); transition:transform 0.15s ease; }
  .scan-zone:active .pin-avatar{ transform:scale(0.93); }
  .pin-point{ width:0; height:0; margin-top:-6px; border-left:9px solid transparent; border-right:9px solid transparent; border-top:14px solid var(--red); filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  .pin-ring{ position:absolute; top:32px; left:50%; transform:translateX(-50%); width:64px; height:64px; border-radius:50%; border:2px solid var(--red); opacity:0; }
  .pin-ring.spin{ animation:ring-pulse 1.8s ease-out infinite; }
  .pin.p2 .pin-ring{ border-color:var(--yellow); }
  @keyframes ring-pulse{ 0%{ transform:translateX(-50%) scale(0.7); opacity:0.7; } 100%{ transform:translateX(-50%) scale(2.1); opacity:0; } }
  .pin-name{ margin-top:14px; font-size:9px; letter-spacing:0.12em; color:var(--ink-dim); text-transform:uppercase; }

  .scan-burst{
    position:absolute; top:32px; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%; pointer-events:none;
  }
  .scan-burst span{
    position:absolute; top:50%; left:50%; width:3px; height:3px; border-radius:50%;
    background:var(--yellow); opacity:0;
  }
  .scan-burst.fire span{ animation:burst-out 0.7s ease-out forwards; }
  @keyframes burst-out{ 0%{ opacity:1; transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1); } 100%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--ang)) translateX(46px) scale(0.3); } }

  .merge-plus{ position:absolute; top:52px; left:50%; transform:translateX(-50%); font-family:var(--display); font-size:22px; color:var(--yellow); opacity:0; }
  .merge-plus.show{ opacity:1; animation:pop-in 0.4s ease; }
  @keyframes pop-in{ 0%{ transform:translateX(-50%) scale(0.4); } 60%{ transform:translateX(-50%) scale(1.3); } 100%{ transform:translateX(-50%) scale(1); } }

  .coffee-stage{ position:relative; height:110px; display:flex; align-items:center; justify-content:center; margin:8px 0; }
  .coffee-emoji{ font-size:46px; }
  .steam{ position:absolute; top:14px; font-size:16px; opacity:0; color:var(--web); }
  .steam.go{ animation:steam-rise 2.6s ease-in infinite; }
  .steam.s1{ left:calc(50% - 16px); animation-delay:0s; } .steam.s2{ left:calc(50% + 2px); animation-delay:0.6s; } .steam.s3{ left:calc(50% + 18px); animation-delay:1.2s; }
  @keyframes steam-rise{ 0%{ opacity:0; transform:translateY(0) translateX(0) scale(0.8); } 20%{ opacity:0.7; } 100%{ opacity:0; transform:translateY(-50px) translateX(6px) scale(1.3); } }

  /* ===== MAP / TRANSIT ===== */
  .map-frame{ padding-top:24px; }
  .map-box{
    position:relative; width:100%; aspect-ratio:5/3; border-radius:10px; overflow:hidden;
    background:radial-gradient(ellipse at 30% 20%, #10161f, var(--map-bg));
    border:1px solid var(--web-dim); margin:8px 0 14px;
  }
  .map-box svg{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
  .map-grid line{ stroke:var(--map-line); stroke-width:1; animation:gridPulse 3.6s ease-in-out infinite; }
  @keyframes gridPulse{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }
  .map-block{ fill:#0f141c; stroke:var(--map-line); stroke-width:1; transform-box:fill-box; transform-origin:center; animation:blockGlow 3.2s ease-in-out infinite; }
  .map-block:nth-of-type(3){ animation-delay:.4s; }
  .map-block:nth-of-type(4){ animation-delay:.8s; }
  .map-block:nth-of-type(5){ animation-delay:1.2s; }
  .map-block:nth-of-type(6){ animation-delay:1.6s; }
  @keyframes blockGlow{
    0%,100%{ fill:#0f141c; stroke:var(--map-line); filter:none; }
    50%{ fill:#182234; stroke:var(--red); filter:drop-shadow(0 0 4px rgba(224,38,61,0.55)); }
  }
  .route-path{ fill:none; stroke:url(#routeGrad); stroke-width:4; stroke-linecap:round; }
  .route-path.flow{ animation:ants 0.6s linear infinite; stroke-dasharray:14 10 !important; }
  @keyframes ants{ to{ stroke-dashoffset:-24; } }
  .route-path-glow{ fill:none; stroke:var(--red); stroke-width:11; stroke-linecap:round; opacity:0.14; animation:idleGlow 2.8s ease-in-out infinite; }
  .route-path-glow.pulse{ animation:glow-pulse 1.1s ease-in-out infinite; }
  @keyframes idleGlow{ 0%,100%{ opacity:0.08; stroke-width:9; } 50%{ opacity:0.22; stroke-width:12; } }
  @keyframes glow-pulse{ 0%,100%{ opacity:0.1; stroke-width:11; } 50%{ opacity:0.28; stroke-width:15; } }

  /* ===== ambient map animation: radar sweep + scanning line + drifting particles ===== */
  .map-box::before{
    content:''; position:absolute; inset:-20%; z-index:2; pointer-events:none;
    background:conic-gradient(from 0deg, rgba(224,38,61,0) 0deg, rgba(224,38,61,0.28) 16deg, rgba(224,38,61,0) 42deg);
    animation:radarSpin 4.2s linear infinite; mix-blend-mode:screen;
  }
  @keyframes radarSpin{ to{ transform:rotate(360deg); } }
  .map-box::after{
    content:''; position:absolute; left:0; right:0; top:0; height:2px; z-index:3; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(255,210,63,0.75), transparent);
    box-shadow:0 0 10px rgba(255,210,63,0.5);
    animation:mapScan 3.4s ease-in-out infinite;
  }
  @keyframes mapScan{
    0%{ top:0%; opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ top:100%; opacity:0; }
  }
  .map-particles{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .map-particles span{
    position:absolute; width:3px; height:3px; border-radius:50%; background:var(--yellow);
    opacity:0; animation:mapDrift 5s linear infinite;
  }
  .map-particles span:nth-child(1){ left:12%; top:78%; animation-delay:0s; }
  .map-particles span:nth-child(2){ left:38%; top:85%; animation-delay:1.1s; background:var(--red); }
  .map-particles span:nth-child(3){ left:64%; top:70%; animation-delay:2.2s; }
  .map-particles span:nth-child(4){ left:82%; top:88%; animation-delay:3.1s; background:var(--red); }
  .map-particles span:nth-child(5){ left:24%; top:60%; animation-delay:.6s; }
  .map-particles span:nth-child(6){ left:52%; top:92%; animation-delay:2.8s; }
  @keyframes mapDrift{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    15%{ opacity:.9; }
    100%{ opacity:0; transform:translateY(-60px) scale(1.1); }
  }
  .compass{ z-index:4; }
  .map-pin-end{ z-index:4; }
  .map-avatar-marker{ z-index:5; }

  .map-pin-end{ position:absolute; width:22px; height:22px; transform:translate(-50%,-100%); opacity:0; transition:opacity 0.3s ease; }
  .map-pin-end.show{ opacity:1; animation:pin-drop 0.5s cubic-bezier(.34,1.56,.64,1); }
  .map-pin-end svg{ width:100%; height:100%; overflow:visible; }

  .map-avatar-marker{
    position:absolute; width:34px; height:34px; transform:translate(-50%,-50%); border-radius:50%;
    border:2.5px solid var(--red); box-shadow:0 0 0 4px rgba(224,38,61,0.2), 0 6px 14px rgba(0,0,0,0.5);
    background:var(--panel); overflow:hidden; opacity:0; z-index:3;
  }
  .map-avatar-marker img{ width:100%; height:100%; object-fit:cover; }
  .map-avatar-marker.marker-b{ width:26px; height:26px; border-color:var(--yellow); }

  .sparkle{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--yellow); pointer-events:none; z-index:2; opacity:0.9; animation:spark-fade 0.6s ease-out forwards; }
  @keyframes spark-fade{ to{ opacity:0; transform:scale(0.2) translateY(6px); } }

  .stamp{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4) rotate(-8deg);
    font-family:var(--display); font-size:38px; letter-spacing:0.05em;
    color:var(--yellow); opacity:0; z-index:5; pointer-events:none;
    text-shadow:0 0 20px rgba(255,210,63,0.7);
  }
  .stamp.play{ animation:stamp-in 0.7s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes stamp-in{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-14deg); } 55%{ opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(4deg); } 75%{ transform:translate(-50%,-50%) scale(0.95) rotate(-2deg); } 100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-4deg); } }

  .websnap{ position:absolute; width:60px; height:60px; transform:translate(-50%,-50%); pointer-events:none; opacity:0; z-index:4; }
  .websnap.play{ animation:snap-out 0.5s ease-out forwards; }
  @keyframes snap-out{ 0%{ opacity:1; transform:translate(-50%,-50%) scale(0.2); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.8); } }
  .websnap svg{ width:100%; height:100%; }
  .websnap line{ stroke:var(--web); stroke-width:1.4; }

  .recalc{ position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:0.18em; color:var(--web); text-transform:uppercase; display:flex; align-items:center; gap:6px; opacity:0; transition:opacity 0.3s ease; }
  .recalc.show{ opacity:1; }
  .spinner{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--web-dim); border-top-color:var(--red); animation:spin 0.7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .route-info{ display:flex; align-items:center; justify-content:center; gap:18px; font-family:var(--mono); font-size:12px; color:var(--ink); margin-bottom:8px; }
  .route-info .ri-item{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .route-info .ri-label{ font-size:8px; letter-spacing:0.15em; color:var(--ink-dim); text-transform:uppercase; }
  .route-info .ri-value{ font-family:var(--display); font-size:20px; letter-spacing:0.03em; color:var(--red); }

  .route-caption{ display:flex; align-items:center; justify-content:center; gap:10px; font-size:13px; color:var(--ink); margin-top:2px; flex-wrap:wrap; }
  .route-caption .pin-label{ color:var(--web); text-decoration:none; border-bottom:1px dashed var(--web-dim); transition:color .15s ease, border-color .15s ease; } .route-caption .pin-label:hover{ color:var(--red); border-color:var(--red); } .route-caption .arrow{ color:var(--red); }

  .compass{ position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; border:1px solid var(--web-dim); background:rgba(7,7,11,0.6); display:flex; align-items:center; justify-content:center; }
  .compass-needle{ width:2px; height:11px; background:var(--red); border-radius:2px; transform-origin:center 80%; transition:transform 0.15s linear; }

  /* action button (game HUD bottom) */
  #actionbar{ position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 20px 20px; }
  .level-track{ display:flex; gap:6px; }
  .pdot{ width:6px; height:6px; border-radius:50%; background:var(--web-dim); transition:all 0.3s ease; }
  .pdot.on{ background:var(--red); box-shadow:0 0 8px rgba(224,38,61,0.7); width:18px; border-radius:3px; }
  .pdot.done{ background:var(--green); }

  .action-btn{
    position:relative; overflow:hidden;
    font-family:var(--mono); font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--bg); background:linear-gradient(135deg, var(--red), var(--magenta));
    border:none; border-radius:30px; padding:13px 30px;
    box-shadow:0 8px 24px rgba(224,38,61,0.35); cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:transform 0.12s ease, opacity 0.3s ease, box-shadow 0.2s ease;
  }
  .action-btn:active{ transform:scale(0.95); }
  .action-btn[disabled]{ opacity:0.55; cursor:default; box-shadow:none; background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--web-dim); }
  .action-btn.hidden{ display:none; }
  .action-btn .glow-ring{
    position:absolute; inset:-2px; border-radius:30px; opacity:0; pointer-events:none;
  }
  .action-btn.pulseglow{ animation:btn-pulse 1.4s ease-in-out infinite; }
  @keyframes btn-pulse{ 0%,100%{ box-shadow:0 8px 24px rgba(224,38,61,0.35); } 50%{ box-shadow:0 8px 32px rgba(224,38,61,0.65); } }

  /* final screen flourish */
  .heart-burst{ position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:10px; }
  .heart{ position:absolute; bottom:-20px; font-size:16px; opacity:0; animation:rise 4s ease-in forwards; }
  @keyframes rise{ 0%{ opacity:0; transform:translateY(0) scale(0.6); } 10%{ opacity:1; } 90%{ opacity:0.8; } 100%{ opacity:0; transform:translateY(-340px) translateX(var(--drift,0px)) scale(1); } }
  .final-avatars{ display:flex; justify-content:center; margin:10px 0 6px; }
  .final-avatars img{ width:78px; height:78px; border-radius:50%; object-fit:cover; border:3px solid var(--red); box-shadow:0 10px 24px rgba(0,0,0,0.5); }
  .final-avatars img:last-child{ margin-left:-18px; border-color:var(--green); }
  .final-score{
    margin-top:14px; font-family:var(--display); font-size:26px; letter-spacing:0.05em; color:var(--yellow);
  }
  .replay-btn{ margin-top:16px; background:transparent; border:1px solid var(--web-dim); color:var(--ink-dim); font-family:var(--mono); font-size:10px; letter-spacing:0.25em; text-transform:uppercase; padding:10px 18px; border-radius:4px; cursor:pointer; }
  .replay-btn:hover{ border-color:var(--red); color:var(--red); }

  /* ===== final web-draw overlay ===== */
  .final-web-wrap{ position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden; }
  .final-web-wrap svg{ width:min(140vw, 900px); height:auto; opacity:0; }
  .final-web-wrap.playing svg{ opacity:.5; transition:opacity .4s ease; }
  .final-thread{ fill:none; stroke:var(--red); stroke-width:1; stroke-linecap:round; }
  .united-title{
    position:relative; z-index:1;
    font-family:var(--display); font-size:clamp(30px,7.5vw,46px); letter-spacing:0.06em;
    color:var(--ink); text-shadow:0 0 26px rgba(224,38,61,0.55);
    margin:14px 0 6px; opacity:0;
  }
  .united-sub{
    position:relative; z-index:1;
    font-family:var(--mono); font-size:13px; letter-spacing:0.04em; color:var(--web);
    max-width:320px; margin:0 auto 6px; line-height:1.7; opacity:0;
  }
  @keyframes finalTextPop{ from{ opacity:0; transform:translateY(14px) scale(.94); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes titleGlowPulse{ 0%,100%{ text-shadow:0 0 18px rgba(224,38,61,0.4);} 50%{ text-shadow:0 0 34px rgba(224,38,61,0.85);} }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>

<script>
(function(){
  const CODE = "2305";
  let entered = "";
  const slots = document.querySelectorAll('.digit-slot');
  const gate = document.getElementById('gate');
  const gateError = document.getElementById('gateError');
  const keypad = document.getElementById('keypad');
  const deck = document.getElementById('deck');
  const progressDots = document.getElementById('progressDots');
  const actionbar = document.getElementById('actionbar');
  const actionBtn = document.getElementById('actionBtn');
  const statusbar = document.getElementById('statusbar');
  const levelTag = document.getElementById('levelTag');
  const xpVal = document.getElementById('xpVal');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const HER = window.AVATAR_HER;
  const HIM = window.AVATAR_HIM;

  function updateSlots(){ slots.forEach((s,i)=> s.classList.toggle('filled', i < entered.length)); }
  function mapsLink(place){
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place + ', România');
  }
  function pressDigit(d){
    if(entered.length >= 4) return;
    entered += d; updateSlots();
    if(entered.length === 4){
      setTimeout(()=>{
        if(entered === CODE){ unlock(); }
        else{ gateError.classList.add('show'); setTimeout(()=>{ entered=""; updateSlots(); gateError.classList.remove('show'); }, 500); }
      }, 150);
    }
  }
  keypad.addEventListener('click', (e)=>{
    const btn = e.target.closest('.key'); if(!btn) return;
    if(btn.id === 'clearKey'){ entered=""; updateSlots(); return; }
    if(btn.id === 'backKey'){ entered = entered.slice(0,-1); updateSlots(); return; }
    if(btn.dataset.k !== undefined) pressDigit(btn.dataset.k);
  });
  document.addEventListener('keydown', (e)=>{
    if(gate.classList.contains('active')){
      if(/^[0-9]$/.test(e.key)) pressDigit(e.key);
      if(e.key === 'Backspace'){ entered = entered.slice(0,-1); updateSlots(); }
      if(e.key === 'Escape'){ entered=""; updateSlots(); }
    }
  });

  function unlock(){
    gate.classList.remove('active');
    setTimeout(()=>{
      deck.classList.add('active');
      actionbar.style.display = 'flex';
      statusbar.style.display = 'flex';
      buildDeck();
    }, 300);
  }

  /* ============ GAME STATE ============ */
  let score = 0;
  function addXP(amount){
    score += amount;
    xpVal.textContent = score;
    xpVal.style.transform = 'scale(1.4)';
    setTimeout(()=> xpVal.style.transform = 'scale(1)', 220);
    const p = document.createElement('div');
    p.className = 'xp-popup';
    p.textContent = '+' + amount + ' XP';
    document.body.appendChild(p);

  function burstSpans(){
    let out = '';
    for(let i=0;i<10;i++){ out += `<span style="--ang:${i*36}deg"></span>`; }
    return out;
  }

  function goTo(idx){
    if(idx >= slides.length) return;
    if(current >= 0){ document.getElementById('frame-' + slides[current].id).style.display = 'none'; }
    current = idx;
    const s = slides[current];
    const frameEl = document.getElementById('frame-' + s.id);
    frameEl.style.display = 'block';
    frameEl.style.animation = 'none'; void frameEl.offsetWidth; frameEl.style.animation = 'fadeUp 0.5s ease';

    document.querySelectorAll('.pdot').forEach((d,i)=>{
      d.classList.toggle('on', i === idx);
      d.classList.toggle('done', i < idx);
    });
    levelTag.textContent = 'LEVEL ' + (idx+1) + '/' + slides.length;
    const lvlBadge = document.getElementById('lvlbadge-' + s.id);
    if(lvlBadge) lvlBadge.textContent = 'LEVEL ' + (idx+1) + '/' + slides.length;

    if(s.type === 'transit'){
      phase = 'idle';
      setActionBtn('🕸️ START TRACKING', false, false);
    } else if(s.type === 'final'){
      phase = 'final';
      document.getElementById('finalScore').textContent = 'SCORE: ' + score;
      playFinalWeb(s.id);
      typeLines('type-' + s.id, s.lines, ()=>{ if(s.toastMsg) showToast(s.toastMsg); launchHearts(); });
      setActionBtn('▶ REPLAY', false, true);
    } else {
      phase = 'locked';
      setActionBtn('🔍 TAP TO SCAN', false, false);
      document.getElementById('type-' + s.id).innerHTML = '';
      const zone = document.getElementById('scanzone-' + s.id);
      zone.classList.remove('revealed');
      zone.onclick = ()=> doScan(s);
    }
  }

  function setActionBtn(label, disabled, isReplay){
    actionBtn.textContent = label;
    actionBtn.disabled = !!disabled;
    actionBtn.classList.toggle('pulseglow', !disabled && !isReplay);
    actionBtn.onclick = isReplay ? ()=>{ score = 0; xpVal.textContent = '0'; goTo(0); } : handleActionClick;
  }

  function handleActionClick(){
    const s = slides[current];
    if(s.type === 'transit'){
      if(phase === 'idle'){ startTransit(s); }
      else if(phase === 'tracked'){ advance(); }
    } else {
      if(phase === 'locked'){ doScan(s); }
      else if(phase === 'revealed'){ advance(); }
    }
  }

  function advance(){
    if(current < slides.length - 1){ goTo(current + 1); }
  }

  function doScan(s){
    if(phase !== 'locked') return;
    phase = 'scanning';
    setActionBtn('SCANNING...', true, false);
    const zone = document.getElementById('scanzone-' + s.id);

    // fire ring + burst on each pin
    const pinCount = s.pins ? s.pins.length : (s.type === 'update' ? 2 : 0);
    for(let i=0;i<pinCount;i++){
      const ring = document.getElementById('ring-' + s.id + '-' + i);
      const burst = document.getElementById('burst-' + s.id + '-' + i);
      if(ring) ring.classList.add('spin');
      if(burst){ burst.classList.add('fire'); }
    }
    if(s.type === 'update'){
      setTimeout(()=>{ document.getElementById('merge-' + s.id).classList.add('show'); }, 500);
    }
    if(s.type === 'coffee'){
      ['steam1-','steam2-','steam3-'].forEach(p=> document.getElementById(p+s.id).classList.add('go'));
    }

    setTimeout(()=>{
      zone.classList.add('revealed');
      typeLines('type-' + s.id, s.lines, ()=>{
        phase = 'revealed';
        addXP(s.xp || 100);
        if(s.toastMsg) showToast(s.toastMsg);
        setActionBtn('▶ CONTINUE', false, false);
      });
    }, 550);
  }

  function startTransit(s){
    phase = 'tracking';
    setActionBtn('TRACKING...', true, false);
    runTransit(s, ()=>{
      phase = 'tracked';
      addXP(s.xp || 150);
      setActionBtn('▶ CONTINUE', false, false);
    });
  }

  function runTransit(s, done){
    const recalc = document.getElementById('recalc-' + s.id);
    const routePath = document.getElementById('route-' + s.id);
    const glowPath = document.getElementById('glow-' + s.id);
    const pinEnd = document.getElementById('pinend-' + s.id);
    const needle = document.getElementById('needle-' + s.id);
    const distEl = document.getElementById('dist-' + s.id);
    const etaEl = document.getElementById('eta-' + s.id);
    const markers = s.markers.map((_,i)=> document.getElementById('marker-' + s.id + '-' + i));
    const mapbox = document.getElementById('mapbox-' + s.id);
    const stampGo = document.getElementById('stampgo-' + s.id);
    const stampArr = document.getElementById('stamparr-' + s.id);
    const snap = document.getElementById('snap-' + s.id);

    recalc.classList.remove('show');
    routePath.style.transition = 'none'; glowPath.style.transition = 'none';
    routePath.style.strokeDashoffset = '1000'; glowPath.style.strokeDashoffset = '1000';
    routePath.classList.remove('flow'); glowPath.classList.remove('pulse');
    pinEnd.classList.remove('show');
    markers.forEach(m=> m.style.opacity = '0');
    stampGo.classList.remove('play'); stampArr.classList.remove('play');
    stampGo.style.opacity = 0; stampArr.style.opacity = 0;

    const totalLen = routePath.getTotalLength ? routePath.getTotalLength() : 300;
    const targetDist = parseFloat(s.dist);
    const targetEta = parseInt(s.eta);
    const startPt = routePath.getPointAtLength(0);

    setTimeout(()=>{ recalc.classList.add('show'); }, 100);

    setTimeout(()=>{
      recalc.classList.remove('show');
      routePath.style.transition = 'stroke-dashoffset 1.1s ease';
      glowPath.style.transition = 'stroke-dashoffset 1.1s ease';
      requestAnimationFrame(()=>{ routePath.style.strokeDashoffset = '0'; glowPath.style.strokeDashoffset = '0'; });
    }, 800);

    setTimeout(()=>{
      // web-snap + GO stamp at start point
      snap.style.left = (startPt.x/400*100) + '%'; snap.style.top = (startPt.y/240*100) + '%';
      snap.classList.remove('play'); void snap.offsetWidth; snap.classList.add('play');
      stampGo.style.opacity = 1; stampGo.classList.add('play');
      setTimeout(()=>{ stampGo.style.opacity = 0; }, 750);

      routePath.classList.add('flow');
      glowPath.classList.add('pulse');
      markers.forEach(m=> m.style.opacity = '1');
      pinEnd.classList.add('show');

      const dur = 2600;
      const startT = performance.now();
      let lastSpark = 0;

      function frame(now){
        let t = Math.min(1, (now - startT) / dur);
        const p0 = routePath.getPointAtLength(Math.max(0, t*totalLen - 6));
        const p1 = routePath.getPointAtLength(Math.min(totalLen, t*totalLen + 6));
        const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180/Math.PI;

        markers.forEach((m, i)=>{
          const offset = i * 8;
          const pt = routePath.getPointAtLength(Math.max(0, t*totalLen - offset));
          m.style.left = (pt.x/400*100) + '%'; m.style.top = (pt.y/240*100) + '%';
        });

        if(now - lastSpark > 90){
          lastSpark = now;
          const headPt = routePath.getPointAtLength(t*totalLen);
          const sp = document.createElement('div');
          sp.className = 'sparkle';
          sp.style.left = (headPt.x/400*100) + '%'; sp.style.top = (headPt.y/240*100) + '%';
          mapbox.appendChild(sp);
          setTimeout(()=> sp.remove(), 650);
        }

        needle.style.transform = 'rotate(' + (angle+90) + 'deg)';
        const remain = Math.max(0, 1-t);
        distEl.textContent = (targetDist * remain).toFixed(1) + ' km';
        etaEl.textContent = Math.max(0, Math.round(targetEta * remain)) + ' min';

        if(t < 1){ requestAnimationFrame(frame); }
        else{
          distEl.textContent = '0.0 km'; etaEl.textContent = 'sosit';
          routePath.classList.remove('flow'); glowPath.classList.remove('pulse');
          const endPt = routePath.getPointAtLength(totalLen);
          stampArr.style.left='50%'; stampArr.style.top='50%';
          stampArr.style.opacity = 1; stampArr.classList.add('play');
          setTimeout(()=>{ stampArr.style.opacity = 0; }, 900);
          done();
        }
      }
      requestAnimationFrame(frame);
    }, 2000);
  }

  function typeLines(elId, lines, onDone){
    const el = document.getElementById(elId);
    if(!el){ if(onDone) onDone(); return; }
    el.innerHTML = '<span class="cursor"></span>';
    if(!lines || !lines.length){ if(onDone) onDone(); return; }
    let out = ''; let lineIdx = 0, charIdx = 0;
    function step(){
      if(lineIdx >= lines.length){ el.innerHTML = out + '<span class="cursor"></span>'; if(onDone) onDone(); return; }
      const cur = lines[lineIdx];
      if(charIdx < cur.length){ charIdx++; el.innerHTML = out + cur.slice(0, charIdx) + '<span class="cursor"></span>'; setTimeout(step, 16); }
      else{ out += cur + '<br>'; lineIdx++; charIdx = 0; setTimeout(step, 220); }
    }
    step();
  }

  function playFinalWeb(id){
    const wrap = document.getElementById('finalweb-' + id);
    const title = document.getElementById('unitedtitle-' + id);
    const sub = document.getElementById('unitedsub-' + id);
    if(!wrap || wrap.dataset.played) return;
    wrap.dataset.played = '1';
    const threads = wrap.querySelectorAll('.final-thread');
    wrap.classList.add('playing');
    threads.forEach((t, i)=>{
      const len = t.getTotalLength();
      t.style.strokeDasharray = len;
      t.style.strokeDashoffset = len;
      t.getBoundingClientRect(); // force reflow
      t.style.transition = `stroke-dashoffset ${0.8 + Math.random()*0.5}s ease`;
      t.style.transitionDelay = (i*0.11).toFixed(2)+'s';
      requestAnimationFrame(()=>{ t.style.strokeDashoffset = '0'; });
    });
    const totalDelay = threads.length*0.11*1000 + 700;
    setTimeout(()=>{
      title.style.animation = 'finalTextPop .8s ease forwards, titleGlowPulse 3.2s ease-in-out 1s infinite';
      sub.style.animation = 'finalTextPop .8s ease forwards';
      sub.style.animationDelay = '.45s';
    }, totalDelay);
  }

  function launchHearts(){
    const hb = document.createElement('div');
    hb.className = 'heart-burst';
    document.getElementById('frame-s5').appendChild(hb);
    const emojis = ['❤️','🕷️','🕸️','💕'];
    for(let i=0;i<24;i++){
      setTimeout(()=>{
        const h = document.createElement('span');
        h.className = 'heart'; h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        h.style.left = (Math.random()*90 + 5) + '%';
        h.style.setProperty('--drift', (Math.random()*60-30) + 'px');
        h.style.animationDuration = (3 + Math.random()*2) + 's';
        hb.appendChild(h);
        setTimeout(()=> h.remove(), 5000);
      }, i * 170);
    }
  }

  updateSlots();
})();
</script>
</body>
</html>
